<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg" />
    <style>
      html, body { padding: 0; margin: 0; background: #0b0c0f; height: 100%; }
      #app { width: 100vw; height: 100vh; outline: 0; }
      /* Debug border to ensure canvas is present */

        content: 'Canvas mounted';
        position: absolute;
        top: 0; left: 0;
        padding: 2px 6px;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        font-size: 10px;
        color: #F59E0B;
        background: rgba(17,24,39,0.9);
      }
    </style>
    <title>Travel Explorer</title>
  </head>
  <body>
    <div id="app"></div>
    <noscript>This app requires JavaScript to run.</noscript>
    <script type="module" src="src/index.js"></script>

</html>
